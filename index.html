<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Progress Bar</title>
</head>
<body>
    <center>
        <font size="7"><b><u>My Skills (Static - HTML Only)</u></b></font>
        <br><br>
        <h1>HTML</h1>
        <input type="range" min="0" max="90" style="accent-color: blue;width: 50%;"><b>90%</b>
        <h1>CSS</h1>
        <input type="range" min="0" max="40" style="accent-color: pink;width: 50%;"><b>40%</b>
        <h1>JAVA SCRIPT</h1>
        <input type="range" min="0" max="40" style="accent-color: black;width: 50%;"><b>40%</b>
    </center>
</body>
</html>
